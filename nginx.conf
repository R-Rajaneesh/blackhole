events {

}
http {
    server {
        listen 80;
        server_name blackhole.localhost;

        location / {
            proxy_pass http://127.0.0.1:8000; # Replace with your Bun app port
            proxy_http_version 1.1;           # Required for performance and keep-alive

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
